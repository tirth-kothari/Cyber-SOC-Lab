[wazuh_servers]
wazuh-server ansible_host=10.10.10.24  # Replace with your 400 VM IP

[ai_nodes]
ai-analyst ansible_host=10.10.10.23    # Replace with your 500 VM IP

[victims]
soc-node-0 ansible_host=10.10.10.16  # Victim node

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
# This line is key: it prevents Ansible from hanging on the "Trust this host?" prompt
ansible_ssh_common_args='-o StrictHostKeyChecking=no'